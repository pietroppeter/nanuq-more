name: Pages

# Renders the explainer (docs/nim_plugins.nim) and, on main, publishes it as the
# repository's GitHub Pages site. Benchmarks are not run here: the page reads the
# results recorded in benchmarks/results/ (rerun them by hand, see benchmarks/).
on:
  push:
    branches: [main]
    paths: ["src/**", "docs/**", "benchmarks/results/**", "pyproject.toml", ".github/workflows/pages.yml"]
  pull_request:
    paths: ["src/**", "docs/**", "benchmarks/results/**", "pyproject.toml", ".github/workflows/pages.yml"]
  workflow_dispatch:

env:
  # Nanuq 0.6.1, the first release with registerPluginFunction (the main commit that
  # added the lib-v0.6.1 sums; tag v0.6.1 once it exists). Its prebuilt library is
  # downloaded, so no Rust is built here.
  NANUQ_REF: 1da3d9943f7af2791b803976fb1c4e3343a067c0

jobs:
  render:
    runs-on: ubuntu-24.04  # still ships libpcre3, which nimib's markdown renderer needs
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: pietroppeter/nanuq
          ref: ${{ env.NANUQ_REF }}
          path: nanuq
      # the prebuilt Nanuq library, downloaded once per Nanuq version (a GitHub
      # release download can time out)
      - uses: actions/cache@v4
        with:
          path: ~/.cache/nanuq
          key: nanuq-lib-${{ runner.os }}-${{ env.NANUQ_REF }}
      - uses: jiro4989/setup-nim-action@v2
        with:
          nim-version: "2.2.4"
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - run: sudo apt-get update && sudo apt-get install -y libpcre3 lld  # lld: the runner image no longer has ld.lld on PATH
      # nimib, installed once (a fixed key: bump v1 to refresh it)
      - uses: actions/cache@v4
        with:
          path: ~/.nimble
          key: nimble-nimib-${{ runner.os }}-2.2.4-v1
      - run: nimble path nimib > /dev/null 2>&1 || nimble install -y nimib
      # Nim's build cache: the C files of an unchanged module are not recompiled, and the
      # plugin libraries the page builds at compile time are reused while src/ is unchanged
      - uses: actions/cache@v4
        with:
          path: .nimcache
          key: nimcache-${{ runner.os }}-${{ env.NANUQ_REF }}-${{ hashFiles('src/**', 'docs/**') }}
          restore-keys: nimcache-${{ runner.os }}-${{ env.NANUQ_REF }}-
      # The Python package, built by nimlang into a wheel, for the page's Python cells
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: pyproject.toml
      - run: |
          uv build --wheel
          uv venv .venv
          uv pip install --python .venv/bin/python dist/*.whl
      - name: Render the explainer
        run: |
          # lld links against the 300 MB Polars library in under a second (GNU ld: ~10 s)
          NANUQ_MORE_PYTHON=$PWD/.venv/bin/python nim r -d:release --hints:off \
            --nimcache:$PWD/.nimcache --passL:-fuse-ld=lld --passL:-Wl,--strip-debug \
            --path:nanuq/src --path:nanuq/docs --path:src -d:nanuqLib=prebuilt \
            docs/nim_plugins.nim
      - run: |
          mkdir -p _site
          cp docs/nim_plugins.html _site/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: render
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: true
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
