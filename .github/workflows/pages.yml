name: Pages

# Renders the explainer (docs/nim_plugins.nim) and, on main, publishes it as the
# repository's GitHub Pages site. Benchmarks are not run here: the page reads the
# results recorded in benchmarks/results/ (rerun them by hand, see benchmarks/).
on:
  push:
    branches: [main]
    paths: ["src/**", "docs/**", "benchmarks/results/**", "pyproject.toml", ".github/workflows/pages.yml"]
  pull_request:
    paths: ["src/**", "docs/**", "benchmarks/results/**", "pyproject.toml", ".github/workflows/pages.yml"]
  workflow_dispatch:

env:
  # The Nanuq with registerPluginFunction (nanuq PR #70). Use main once it is
  # merged, and the prebuilt library (-d:nanuqLib=prebuilt) once a lib release has it.
  NANUQ_REF: claude/project-thread-ez686y
  NANUQ_LIB: nanuq/src/rust/target/release

jobs:
  render:
    runs-on: ubuntu-24.04  # still ships libpcre3, which nimib's markdown renderer needs
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: pietroppeter/nanuq
          ref: ${{ env.NANUQ_REF }}
          path: nanuq
      # Nanuq's Rust bridge, cached by a hash of its sources: a hit skips Rust entirely
      - id: key
        run: echo "key=nanuq-ffi-${{ runner.os }}-${{ hashFiles('nanuq/src/rust/Cargo.toml', 'nanuq/src/rust/Cargo.lock', 'nanuq/src/rust/src/**') }}" >> "$GITHUB_OUTPUT"
      - id: lib-cache
        uses: actions/cache@v4
        with:
          path: ${{ env.NANUQ_LIB }}/libnanuq_ffi.a
          key: ${{ steps.key.outputs.key }}
      - if: steps.lib-cache.outputs.cache-hit != 'true'
        uses: dtolnay/rust-toolchain@stable
      - if: steps.lib-cache.outputs.cache-hit != 'true'
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: nanuq/src/rust
      - if: steps.lib-cache.outputs.cache-hit != 'true'
        run: cargo build --release --manifest-path nanuq/src/rust/Cargo.toml
      - uses: jiro4989/setup-nim-action@v2
        with:
          nim-version: "2.2.4"
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - run: sudo apt-get update && sudo apt-get install -y libpcre3
      - uses: actions/cache@v4
        with:
          path: ~/.nimble
          key: nimble-pages-2.2.4-${{ hashFiles('.github/workflows/pages.yml') }}
      - run: nimble install -y nimib
      # The Python package, built by nimlang into a wheel, for the page's Python cells
      - uses: astral-sh/setup-uv@v6
      - run: |
          uv build --wheel
          uv venv .venv
          uv pip install --python .venv/bin/python dist/*.whl
      - name: Render the explainer
        run: |
          NANUQ_MORE_PYTHON=$PWD/.venv/bin/python nim r -d:release --hints:off \
            --path:nanuq/src --path:nanuq/docs --path:src -d:nanuqLibDir=$PWD/$NANUQ_LIB \
            docs/nim_plugins.nim
      - run: |
          mkdir -p _site
          cp docs/nim_plugins.html _site/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: render
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: true
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
