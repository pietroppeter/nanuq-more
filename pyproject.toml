[project]
name = "nanuq-more"
version = "0.0.1"
description = "Polars expression plugins written in Nim: ISO weeks and vectorized distributions"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = ["polars>=1.36"]

[build-system]
requires = ["hatchling", "nimlang"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nanuq_more"]

[tool.hatch.build.hooks.nimlang]
extensions = ["src/nanuq_more/plugins.nim"]   # the plugin library, next to the Python files

[dependency-groups]
dev = ["pytest", "scipy", "numpy", "polars-stats"]
